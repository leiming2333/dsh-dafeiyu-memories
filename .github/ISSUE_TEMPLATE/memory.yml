name: 投稿一条记忆
description: 提交 20-300 字的虚构/半虚构短记忆。提交即按 CC0-1.0 公开，不可撤回。
title: "[记忆] "
labels: ["memory-submission"]
body:
  - type: markdown
    attributes:
      value: |
        > 这里是大肥鱼记忆库（Shoal Atlas）的公开提交入口。
        > Issue 公开可见，请勿填写真实隐私。提交即同意以 CC0-1.0 公开授权。

        ## 投之前先看三遍

        这条一旦合并，授权不可撤回，已经被 fork 或下载的副本也收不回来。

        请不要写：
        - 真实姓名、学校全名、单位全名、住址、手机号、邮箱、QQ、微信号、群号
        - 能通过「时间 + 地点 + 职业」组合定位到真人的细节
        - 别人的创伤、家事、病历
        - 任何可识别未成年人的信息

        正文 20-300 字，虚构或半虚构，有具体场景。

        提交前请读一遍 [审核清单](https://github.com/leiming2333/dsh-dafeiyu-memories/blob/main/docs/review-checklist.md)。

  - type: input
    id: title
    attributes:
      label: 标题
      description: 2-40 字，能看出这条记忆讲什么
      placeholder: 第一次追弹幕
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 正文
      description: 20-300 字。虚构或半虚构，不要写真实隐私。
      placeholder: 它第一次看见弹幕是在一个很晚的直播里。那些字从屏幕右边游过来，密密麻麻……
      render: text
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: 标签
      description: 1-8 个，用中文逗号或英文逗号分隔，每个不超过 16 字
      placeholder: B站, 弹幕, 虚构
    validations:
      required: true

  - type: dropdown
    id: memory_type
    attributes:
      label: 类型
      description: fiction = 完全虚构；semi-fiction = 半虚构（有真实经历打底，细节已改写）
      options:
        - fiction
        - semi-fiction
    validations:
      required: true

  - type: input
    id: contributor
    attributes:
      label: 署名
      description: 留空则写「匿名」。不要填真实姓名。
      placeholder: 匿名
    validations:
      required: false

  - type: checkboxes
    id: agreements
    attributes:
      label: 提交前确认（三项都必须勾）
      options:
        - label: 我确认这是原创内容，或我有权按 CC0-1.0 处置；我理解提交后不可撤回，已 fork / 下载的副本无法收回。
          required: true
        - label: 我确认内容中不含任何真实个人信息（姓名、学校、单位、住址、手机号、邮箱、QQ、微信号、群号），也不含可通过组合信息定位到真人的细节。
          required: true
        - label: 我确认内容不涉及可识别的未成年人，不侵犯第三方隐私，不消费他人创伤。
          required: true
